name: CI Python Completo

on:
  workflow_dispatch:
  
  push:
    branches: [main]
    paths:
      - 'Calculator/**'
      - 'requirements.txt'
      - 'sonar-project.properties'

  pull_request:
    branches: [main]
    paths:
      - 'Calculator/**'
      - 'requirements.txt'
      - 'sonar-project.properties'

jobs:
  testes-e-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar Linter (Flake8)
        run: flake8 Calculator

      - name: Executar Testes com Cobertura
        working-directory: Calculator
        run: pytest --cov=. --cov-report=xml

  build-e-artefato:
    needs: testes-e-linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build do Projeto Python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Gerar artefato ZIP
        run: zip -r pipeline-demo.zip -x "*.git*"

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: codigo-buildado
          path: pipeline-demo.zip

  analise-sonar:
    needs: testes-e-linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes (necessário para o Sonar)
        working-directory: Calculator
        run: pytest --cov=. --cov-report=xml

      - name: Análise de Código (SonarQube)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: [build-e-artefato, analise-sonar]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: codigo-buildado

      - name: Realizar Deploy
        run: echo "Deploy em produção realizado com sucesso!"