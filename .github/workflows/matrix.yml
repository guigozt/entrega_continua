name: Matrix

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'Calculator/**'
      - 'requirements.txt'

  pull_request:
    branches: [main]
    paths:
      - 'Calculator/**'
      - 'requirements.txt'

jobs:
  sistemasOperacionais:
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Executar testes da calculadora
        working-directory: Calculator
        run: python -m pytest